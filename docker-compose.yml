services:
  backend:
    build:
      context: ./backend
    container_name: devflow-backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: devflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend