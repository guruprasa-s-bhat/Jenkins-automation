services:
  backend:
    image: gurubhat01/devops-dashboard-backend:${BUILD_NUMBER}
    container_name: devflow-backend
    ports:
      - "5000:5000"

  frontend:
    image: gurubhat01/devops-dashboard-frontend:${BUILD_NUMBER}
    container_name: devflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend